<!DOCTYPE html>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;

      background:
        radial-gradient(circle at top, #1d2940 0%, #0c1220 45%, #05070d 100%);

      color: white;
    }

    .container {
      width: min(1100px, 92%);
      margin: auto;
      padding: 35px 0 60px;
    }

    h1 {
      text-align: center;
      font-size: 40px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9ba8bd;
      margin-bottom: 35px;
    }

    /* CATEGORY BUTTONS */

    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 12px;
      margin-bottom: 35px;
    }

    .category-btn {
      border: 1px solid #33425e;
      border-radius: 15px;
      padding: 16px 10px;

      background: #121b2c;
      color: white;

      cursor: pointer;
      font-size: 15px;

      transition: .2s;
    }

    .category-btn:hover {
      transform: translateY(-2px);
      border-color: #d8b467;
      background: #1b2940;
    }

    .category-btn.active {
      background: #d8b467;
      color: #111;
      border-color: #d8b467;
      font-weight: bold;
    }

    /* GAME */

    .game-area {
      display: none;
    }

    .category-name {
      text-align: center;
      color: #d8b467;
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .question-card {
      max-width: 760px;
      min-height: 320px;

      margin: auto;
      padding: 40px 35px;

      border-radius: 25px;

      background:
        linear-gradient(145deg, #192438, #0c1320);

      border: 2px solid #d8b467;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, .45);

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;

      cursor: pointer;
      user-select: none;
    }

    .hint {
      color: #8491a8;
      font-size: 13px;
      margin-bottom: 22px;
    }

    #question {
      font-size: 29px;
      line-height: 1.8;
      font-weight: bold;
    }

    #answer {
      display: none;

      width: 100%;
      margin-top: 30px;
      padding-top: 25px;

      border-top: 1px solid #33425e;

      color: #7ee0a3;

      font-size: 25px;
      font-weight: bold;

      line-height: 1.7;
    }

    /* BUTTONS */

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
    }

    #nextBtn {
      border: 0;
      border-radius: 14px;

      padding: 15px 42px;

      background: #d8b467;
      color: #111;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;
    }

    #nextBtn:hover {
      filter: brightness(1.1);
    }

    .counter {
      text-align: center;
      color: #7f8ba0;

      margin-top: 14px;
      font-size: 13px;
    }

    @media(max-width:600px) {

      h1 {
        font-size: 30px;
      }

      .categories {
        grid-template-columns: repeat(2, 1fr);
      }

      .question-card {
        min-height: 280px;
        padding: 30px 20px;
      }

      #question {
        font-size: 23px;
      }

      #answer {
        font-size: 21px;
      }
    }
  </style>
</head>

/* ==========================================
   VARIABLES
========================================== */

let currentCategory = null;
let currentQuestionIndex = null;

const usedQuestions = {};


/* ==========================================
   ELEMENTS
========================================== */

const categoriesDiv =
  document.getElementById("categories");

const gameArea =
  document.getElementById("gameArea");

const categoryName =
  document.getElementById("categoryName");

const questionEl =
  document.getElementById("question");

const answerEl =
  document.getElementById("answer");

const questionCard =
  document.getElementById("questionCard");

const nextBtn =
  document.getElementById("nextBtn");

const counter =
  document.getElementById("counter");


/* ==========================================
   CREATE CATEGORY BUTTONS
========================================== */

Object.keys(quizData).forEach(category => {

  usedQuestions[category] = [];

  const button =
    document.createElement("button");

  button.className = "category-btn";

  button.textContent = category;


  button.addEventListener("click", () => {

    document
      .querySelectorAll(".category-btn")
      .forEach(btn =>
        btn.classList.remove("active")
      );


    button.classList.add("active");


    currentCategory = category;

    categoryName.textContent = category;

    gameArea.style.display = "block";

    loadRandomQuestion();

  });


  categoriesDiv.appendChild(button);

});


/* ==========================================
   RANDOM TEAM DRAW ANSWERS
========================================== */

function generateTeamAnswer(question) {

  switch(question.type) {

    case "number":

      return "🎯 عدد درست: " +
        (Math.floor(Math.random() * 20) + 1);


    case "oddNumber":

      return "🎯 عدد درست: " +
        (Math.floor(Math.random() * 10) + 1);


    case "coin":

      return Math.random() < 0.5
        ? "🪙 جواب: شیر"
        : "🪙 جواب: خط";


    case "hand":

      return Math.random() < 0.5
        ? "✋ جواب: دست راست"
        : "🤚 جواب: دست چپ";


    case "color":

      return Math.random() < 0.5
        ? "🔴 جواب: قرمز"
        : "⚫ جواب: مشکی";


    case "evenodd":

      return Math.random() < 0.5
        ? "جواب: زوج"
        : "جواب: فرد";


    case "highlow":

      return Math.random() < 0.5
        ? "⬆️ جواب: بالا"
        : "⬇️ جواب: پایین";


    case "direction":

      return Math.random() < 0.5
        ? "⬅️ جواب: چپ"
        : "➡️ جواب: راست";


    case "oneTwo":

      return Math.random() < 0.5
        ? "جواب: ۱"
        : "جواب: ۲";


    default:

      return question.a;

  }

}


/* ==========================================
   LOAD RANDOM QUESTION
========================================== */

function loadRandomQuestion() {

  if (!currentCategory)
    return;


  const questions =
    quizData[currentCategory];


  /*
     وقتی همه سوال‌ها استفاده شدند
     دوباره از اول آزاد می‌شوند
  */

  if (
    usedQuestions[currentCategory].length
    === questions.length
  ) {

    usedQuestions[currentCategory] = [];

  }


  let randomIndex;


  do {

    randomIndex =
      Math.floor(
        Math.random() * questions.length
      );

  }

  while (
    usedQuestions[currentCategory]
      .includes(randomIndex)
  );


  usedQuestions[currentCategory]
    .push(randomIndex);


  currentQuestionIndex =
    randomIndex;


  const selectedQuestion =
    questions[randomIndex];


  questionEl.textContent =
    selectedQuestion.q;


  /*
     جواب همین الان ساخته می‌شود
     ولی تا کلیک نکنی دیده نمی‌شود
  */

  answerEl.textContent =
    generateTeamAnswer(selectedQuestion);


  answerEl.style.display =
    "none";


  updateCounter();

}


/* ==========================================
   COUNTER
========================================== */

function updateCounter() {

  const total =
    quizData[currentCategory].length;

  const used =
    usedQuestions[currentCategory].length;


  counter.textContent =
    `${used} / ${total} مورد این دسته استفاده شده`;

}


/* ==========================================
   SHOW ANSWER
========================================== */

questionCard.addEventListener(
  "click",
  () => {

    /*
       فقط جواب را نشان می‌دهد.
       سوال عوض نمی‌شود.
    */

    answerEl.style.display =
      "block";

  }
);


/* ==========================================

========================================== */

nextBtn.addEventListener(
  "click",
  (event) => {

    event.stopPropagation();

    loadRandomQuestion();

  }
);
